name: Manual synthetic research validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MLFLOW_DISABLE_TELEMETRY: 'true'
      MLFLOW_ENABLE_WORKSPACES: 'false'
    steps:
      - name: Check out only the candidate
        timeout-minutes: 3
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select the declared Python patch version
        timeout-minutes: 5
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11.5'
      - name: Require complete offline dependency evidence before installation
        timeout-minutes: 2
        run: |
          timeout --kill-after=10s 60s python -B scripts/verify_portfolio_environment.py --manifest requirements/locks/manifest.json --checkout . --target linux-x86_64-cp3115 --profile test --mode require-complete
      - name: Create owned temporary roots
        timeout-minutes: 2
        run: |
          test "$(uname -s)" = Linux
          APF_QA_ROOT="$(mktemp -d "$RUNNER_TEMP/apf-qa-XXXXXXXX")"
          chmod 700 "$APF_QA_ROOT"
          mkdir -m 700 "$APF_QA_ROOT/test-run"
          printf 'APF_QA_ROOT=%s\n' "$APF_QA_ROOT" >> "$GITHUB_ENV"
          timeout --kill-after=10s 60s python -m venv "$APF_QA_ROOT/environment"
      - name: Build and install the declared research profile
        timeout-minutes: 10
        run: |
          timeout --kill-after=15s 120s "$APF_QA_ROOT/environment/bin/python" -m pip install setuptools==68.0.0 wheel==0.38.4
          timeout --kill-after=15s 300s "$APF_QA_ROOT/environment/bin/python" -m pip wheel --no-build-isolation --wheel-dir "$APF_QA_ROOT/wheelhouse" .
          wheels=("$APF_QA_ROOT"/wheelhouse/apf_research_portfolio-*.whl)
          test "${#wheels[@]}" -eq 1
          timeout --kill-after=15s 300s "$APF_QA_ROOT/environment/bin/python" -m pip install "${wheels[0]}[tracking,test]"
          timeout --kill-after=10s 30s "$APF_QA_ROOT/environment/bin/python" -m pip check
      - name: Run one complete native Linux research test session
        timeout-minutes: 17
        run: |
          timeout --kill-after=20s 960s "$APF_QA_ROOT/environment/bin/python" -B scripts/portfolio_ci.py --root "$APF_QA_ROOT/test-run" --platform linux --timeout-seconds 900
      - name: Upload only bounded sanitized evidence
        if: ${{ always() && env.APF_QA_ROOT != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: synthetic-research-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 9
          path: |
            ${{ env.APF_QA_ROOT }}/test-run/evidence/summary.json
            ${{ env.APF_QA_ROOT }}/test-run/evidence/diagnostics.json
            ${{ env.APF_QA_ROOT }}/test-run/evidence/junit.xml
