[build-system]
requires = ["setuptools==68.0.0", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "apf-research-portfolio"
version = "1.0.0rc1"
description = "Causal synthetic XGBoost research, verifiable artifacts and execution accounting"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: Other/Proprietary License"]
requires-python = ">=3.11,<3.12"
dependencies = [
 "numpy==1.26.4", "pandas==2.2.3", "scipy==1.14.1",
 "scikit-learn==1.3.0", "xgboost==3.2.0", "pyarrow==18.1.0",
 "omegaconf==2.3.1", "SQLAlchemy==1.4.39", "joblib==1.2.0",
 "PyYAML==6.0", "pytz==2023.3.post1"
]

[project.optional-dependencies]
tracking = ["mlflow==3.14.0", "matplotlib==3.9.4", "cryptography>=43,<49"]
test = ["pytest==8.3.5"]

[project.scripts]
apf-synthetic = "examples.synthetic_research:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "examples"]
namespaces = true

[tool.setuptools.package-data]
src = ["public_defaults/synthetic.yaml", "public_defaults/tracking.yaml", "public_defaults/environment.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
